blockExoticSubdeps: true

minimumReleaseAge: 10080
minimumReleaseAgeExcludePrune: true
# First-party rotki packages: the maturity gate guards against third-party
# supply-chain surprises, not against our own releases.
minimumReleaseAgeExclude:
  - '@rotki/ui-library'
  - '@rotki/eslint-config'
  - '@rotki/eslint-plugin'

trustPolicy: no-downgrade
shellEmulator: true
strictDepBuilds: true
saveExact: true

overrides:
  # oxfmt 0.35, which eslint-plugin-format caps @rotki/eslint-config at, pins tinypool 2.1.0
  # (GHSA advisories fixed in 2.1.2). Remove once eslint-plugin-format moves to a newer oxfmt.
  oxfmt>tinypool: 2.2.0

allowBuilds:
  esbuild: true
