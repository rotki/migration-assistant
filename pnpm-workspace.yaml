blockExoticSubdeps: true

minimumReleaseAge: 10080
minimumReleaseAgeExcludePrune: true
# First-party rotki packages: the maturity gate guards against third-party
# supply-chain surprises, not against our own releases.
minimumReleaseAgeExclude:
  - '@rotki/ui-library'
  - '@rotki/eslint-config'
  - '@rotki/eslint-plugin'
  # Renovate security update: vue-i18n@11.4.14
  - vue-i18n@11.4.14

trustPolicy: no-downgrade
shellEmulator: true
strictDepBuilds: true
saveExact: true

allowBuilds:
  esbuild: true
