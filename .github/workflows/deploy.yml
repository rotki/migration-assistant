name: deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

# A newer push supersedes an in-flight deployment.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # OIDC token to sign the build provenance
      attestations: write # store the provenance next to the repository
    steps:
      - name: Checkout 🛎
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      # No dependency cache: a cache entry written by another workflow run must not end up
      # inside a deployed, attested build.
      - name: Setup node env 🏗
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies 👨🏻‍💻
        run: pnpm install --frozen-lockfile

      # GITHUB_SHA and the run id end up in the footer, linking the deployment to its source.
      - name: Build
        run: pnpm run build

      # Lets anyone check a deployed file came from this commit:
      # gh attestation verify <file> --repo rotki/migration-assistant
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/**/*.html
            dist/assets/*.js
            dist/assets/*.js.map
            dist/assets/*.css

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # publish the built site to GitHub Pages
      id-token: write # OIDC token for the Pages deployment
    # Requires approval from a maintainer and accepts deployments from main only.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
