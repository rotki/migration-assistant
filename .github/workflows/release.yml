name: release

# One click from the Actions tab releases the current main: build, deploy after a maintainer
# approves it, then tag the deployed commit and publish notes generated from its commits.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the leading v, such as 0.2.0'
        required: true
        type: string

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check version and branch
        id: version
        env:
          VERSION: ${{ inputs.version }}
          REF: ${{ github.ref }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Releases are cut from main, not $REF."
            exit 1
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version must look like 1.2.3."
            exit 1
          fi
          if gh api "repos/$REPOSITORY/git/ref/tags/v$VERSION" > /dev/null 2>&1; then
            echo "::error::Tag v$VERSION already exists."
            exit 1
          fi
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

  build:
    name: build
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # OIDC token to sign the build provenance
      attestations: write # store the provenance next to the repository
    steps:
      - name: Checkout 🛎
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # No dependency cache: a cache entry written by another workflow run must not end up
      # inside a deployed, attested build.
      - name: Setup node env 🏗
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies 👨🏻‍💻
        run: pnpm install --frozen-lockfile

      # The version, GITHUB_SHA and the run id end up in the footer.
      - name: Build
        run: pnpm run build
        env:
          APP_VERSION: ${{ needs.prepare.outputs.tag }}

      - name: Package the site
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: tar -czf "migration-assistant-$TAG.tar.gz" -C dist .

      # Lets anyone check a deployed file, or the release tarball, came from this commit:
      # gh attestation verify <file> --repo rotki/migration-assistant
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/**/*.html
            dist/assets/*.js
            dist/assets/*.js.map
            dist/assets/*.css
            migration-assistant-*.tar.gz

      - name: Upload the release tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-tarball
          path: migration-assistant-*.tar.gz
          retention-days: 1
          if-no-files-found: error

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # publish the built site to GitHub Pages
      id-token: write # OIDC token for the Pages deployment
    # Requires approval from a maintainer and accepts deployments from main only.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  publish:
    name: publish
    needs: [prepare, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the tag and the GitHub release
    steps:
      - name: Checkout 🛎
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup node env 🏗
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies 👨🏻‍💻
        run: pnpm install --frozen-lockfile

      - name: Download the release tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-tarball

      # The tag points at the commit that was built and deployed, not at a later main.
      - name: Tag the deployed commit
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh api "repos/$REPOSITORY/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA" > /dev/null
          git tag "$TAG" "$GITHUB_SHA"

      - name: Publish release notes
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm exec changelogithub --to "$TAG" --assets "migration-assistant-$TAG.tar.gz"
